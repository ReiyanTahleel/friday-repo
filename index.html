<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>F.R.I.D.A.Y - Arc Reactor HUD</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030712;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: #00f3ff;
        }

        /* Initial Boot Screen to allow audio autoplay */
        #init-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .boot-btn {
            background: rgba(0, 243, 255, 0.1);
            color: #00f3ff;
            border: 2px solid #00f3ff;
            padding: 16px 36px;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 4px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            text-transform: uppercase;
        }

        .boot-btn:hover {
            background: #00f3ff;
            color: #030712;
            box-shadow: 0 0 30px #00f3ff;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            padding: 40px;
        }

        .header {
            text-align: center;
            letter-spacing: 4px;
            text-shadow: 0 0 10px #00f3ff;
        }

        .header h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 300;
        }

        .console-log {
            max-width: 650px;
            width: 90%;
            background: rgba(10, 20, 35, 0.75);
            border: 1px solid rgba(0, 243, 255, 0.3);
            backdrop-filter: blur(8px);
            padding: 18px;
            border-radius: 12px;
            text-align: center;
            font-size: 1.05rem;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.15);
            color: #ffffff;
            line-height: 1.5;
            margin-bottom: 30px;
            /* Moved up slightly since button is gone */
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

    <!-- Initialization Overlay -->
    <div id="init-overlay" onclick="bootSystem()">
        <button class="boot-btn">INITIALIZE F.R.I.D.A.Y.</button>
    </div>

    <div id="canvas-container"></div>

    <div class="hud-overlay">
        <div class="header">
            <h1>F.R.I.D.A.Y</h1>
            <p>MARK V SYSTEM INTERFACE</p>
        </div>
        <div class="console-log" id="statusLog">SYSTEM OFFLINE</div>
    </div>

    <script>
        // 1. STATE SETUP
        const STATE = { IDLE: 'idle', RECORDING: 'recording', PROCESSING: 'processing', SPEAKING: 'speaking' };
        let currentState = STATE.IDLE;

        const statusLog = document.getElementById('statusLog');
        let ws;

        // Web Audio API Analyzer Setup
        let audioCtx, analyser, dataArray, sourceNode;

        function setupAudioAnalyser(audioElement) {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 64;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (!audioElement._hasAudioSource) {
                sourceNode = audioCtx.createMediaElementSource(audioElement);
                sourceNode.connect(analyser);
                analyser.connect(audioCtx.destination);
                audioElement._hasAudioSource = true;
            }
        }

        // Web Speech API for instant, hands-free listening
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;

        function bootSystem() {
            document.getElementById("init-overlay").style.display = "none";
            statusLog.innerText = "Connecting to neural core...";

            // Connect to Python WebSockets (Updated endpoint to standard /ws)
            ws = new WebSocket("ws://localhost:8000/ws");

            ws.onopen = () => {
                statusLog.innerText = "Systems online. Awaiting command.";
            };

            ws.onerror = () => {
                statusLog.innerText = "Connection Error. Make sure server.py is running.";
            };

            ws.onmessage = async (event) => {
                // If audio Blob is received (FRIDAY talking)
                if (event.data instanceof Blob) {
                    currentState = STATE.SPEAKING;
                    try { recognition.stop(); } catch (e) { } // Pause listening

                    const audio = new Audio(URL.createObjectURL(event.data));
                    audio.crossOrigin = "anonymous";
                    setupAudioAnalyser(audio);

                    audio.onended = () => {
                        currentState = STATE.IDLE;
                        coreMesh.scale.set(1, 1, 1);
                        setTimeout(() => { try { recognition.start(); } catch (e) { } }, 300); // Resume listening
                    };

                    await audio.play();
                } else {
                    // If text JSON is received
                    const data = JSON.parse(event.data);
                    if (data.text) {
                        statusLog.innerHTML = `<b style="color:#00f3ff;">FRIDAY:</b> ${data.text}`;
                    }
                    if (data.status === "processing") {
                        currentState = STATE.PROCESSING;
                        statusLog.innerText = "Processing command...";
                    }
                }
            };

            // Start listening shortly after boot
            setTimeout(() => { try { recognition.start(); } catch (e) { } }, 1000);
        }

        // When user speaks
        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            statusLog.innerHTML = `<b style="color:#ff0055;">You:</b> ${transcript}`;
            currentState = STATE.RECORDING; // Briefly pulse red

            setTimeout(() => {
                if (currentState === STATE.RECORDING) currentState = STATE.PROCESSING;
            }, 500);

            ws.send(transcript);
        };

        // Keep loop alive if she isn't speaking
        recognition.onend = () => {
            if (currentState !== STATE.SPEAKING) {
                setTimeout(() => { try { recognition.start(); } catch (e) { } }, 400);
            }
        };

        // 2. THREE.JS SCENE SETUP
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 8;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const arcReactorGroup = new THREE.Group();
        scene.add(arcReactorGroup);

        const coreLight = new THREE.PointLight(0x00f3ff, 5, 20);
        arcReactorGroup.add(coreLight);
        scene.add(new THREE.AmbientLight(0x051525));

        // Core Sphere
        const coreGeo = new THREE.SphereGeometry(0.8, 32, 32);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: true });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        arcReactorGroup.add(coreMesh);

        // Outer Metallic Ring
        const ringGeo = new THREE.TorusGeometry(2.5, 0.18, 16, 100);
        const ringMat = new THREE.MeshStandardMaterial({ color: 0x111827, metalness: 0.9, roughness: 0.2 });
        arcReactorGroup.add(new THREE.Mesh(ringGeo, ringMat));

        // Ring Coils
        const coilGroup = new THREE.Group();
        for (let i = 0; i < 10; i++) {
            const angle = (i / 10) * Math.PI * 2;
            const coilGeo = new THREE.BoxGeometry(0.35, 0.45, 0.2);
            const coilMat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, emissive: 0x00a2ff, emissiveIntensity: 0.8 });
            const coil = new THREE.Mesh(coilGeo, coilMat);
            coil.position.x = Math.cos(angle) * 2.5;
            coil.position.y = Math.sin(angle) * 2.5;
            coil.rotation.z = angle;
            coilGroup.add(coil);
        }
        arcReactorGroup.add(coilGroup);

        // Particles
        const particleGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(600);
        for (let i = 0; i < 600; i++) positions[i] = (Math.random() - 0.5) * 12;
        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleSystem = new THREE.Points(particleGeo, new THREE.PointsMaterial({ color: 0x00f3ff, size: 0.04 }));
        scene.add(particleSystem);

        // 3. ANIMATION LOOP
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();
            particleSystem.rotation.y = elapsedTime * 0.05;

            let audioNormalized = 0;
            if (analyser && currentState === STATE.SPEAKING) {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                audioNormalized = (sum / dataArray.length) / 255;
            }

            switch (currentState) {
                case STATE.IDLE:
                    arcReactorGroup.rotation.z = elapsedTime * 0.3;
                    coilGroup.rotation.z = -elapsedTime * 0.1;
                    coreLight.color.setHex(0x00f3ff);
                    coreMat.color.setHex(0x00f3ff);
                    coreLight.intensity = 3 + Math.sin(elapsedTime * 2) * 1.5;
                    coreMesh.scale.set(1, 1, 1);
                    break;

                case STATE.RECORDING:
                    arcReactorGroup.rotation.z = elapsedTime * 1.5;
                    coreLight.color.setHex(0xff0055);
                    coreMat.color.setHex(0xff0055);
                    coreLight.intensity = 6 + Math.sin(elapsedTime * 15) * 3;
                    break;

                case STATE.PROCESSING:
                    arcReactorGroup.rotation.z = elapsedTime * 3.0;
                    coreLight.color.setHex(0x00a2ff);
                    coreMat.color.setHex(0x00a2ff);
                    coreLight.intensity = 8;
                    break;

                case STATE.SPEAKING:
                    arcReactorGroup.rotation.z = elapsedTime * 0.8;
                    coreLight.color.setHex(0x00ffff);
                    coreMat.color.setHex(0x00ffff);
                    coreLight.intensity = 3.0 + (audioNormalized * 12.0);
                    const scale = 1.0 + (audioNormalized * 0.7);
                    coreMesh.scale.set(scale, scale, scale);
                    coilGroup.children.forEach(c => c.material.emissiveIntensity = 0.5 + (audioNormalized * 3.0));
                    break;
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>

</html>
